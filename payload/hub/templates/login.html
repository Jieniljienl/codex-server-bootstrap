<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>登录 · AI 服务工作台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <span class="brand-mark" aria-hidden="true">A</span>
    <h1>AI 服务工作台</h1>
    <p class="login-description">登录后管理代理节点，并验证模型调用。</p>
    {% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="password">网页访问密码</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus placeholder="输入部署时设置的密码"></div>
      <button class="button button-primary login-submit" type="submit">进入工作台 <span aria-hidden="true">→</span></button>
    </form>
    <p class="login-footer">v{{ version }} · 仅限授权访问</p>
  </main>
</body>
</html>
