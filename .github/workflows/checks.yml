name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Shell syntax
        run: |
          for script in install.sh server-bootstrap.sh server-authorize-key.sh; do
            bash -n "$script"
          done
          bash install.sh --help
          bash install.sh --check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'connect.ps1'), [ref]$tokens, [ref]$parseErrors) > $null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
          if (Test-Path tests/test-connect.ps1) { & .\tests\test-connect.ps1 }
